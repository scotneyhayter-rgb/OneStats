[project]
name = "onestats-api"
version = "0.1.0"
description = "OneStats backend API (Phase 2 foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "defusedxml>=0.7.1",
    "reportlab>=4.2.0",
    # Internet Research Engine: hardened HTTP retrieval (httpx) + HTML parsing (BeautifulSoup/lxml).
    # httpx is also used by the Trove/PlayHQ connectors; it is a runtime dependency, not dev-only.
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    # Pinned so CI lints deterministically — an unpinned ruff would pull a newer default
    # rule set and fail CI on rules the code was never checked against.
    "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onestats*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
