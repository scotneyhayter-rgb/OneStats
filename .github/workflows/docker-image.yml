# OneStats web-app image — builds the single-origin container (backend + built SPA) from the Dockerfile.
#
# Why this exists: it builds the image IN THE CLOUD so no local Docker is needed. On a pull request it
# only BUILDS (the first real `docker build` of the Dockerfile — it was authored but never build-tested,
# see docs/78-cloud-deploy.md), giving a pass/fail without publishing anything. On a push to main, and on
# manual dispatch, it also PUSHES the image to GitHub Container Registry (ghcr.io) — free for this repo.
#
# This is NOT the desktop release (that stays in release.yml, signed + manual). It touches no signing key
# and ships no installer. Pulling the published image later:
#   docker pull ghcr.io/scotneyhayter-rgb/onestats-web:latest

name: Docker image

on:
  push:
    branches: [main]
    # only rebuild when something that affects the image changes
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'apps/desktop/**'
      - 'services/api/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'apps/desktop/**'
      - 'services/api/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch: {}

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # ghcr image name must be lowercase; this repo owner already is.
  IMAGE: ghcr.io/${{ github.repository_owner }}/onestats-web

jobs:
  build:
    name: Build${{ github.event_name != 'pull_request' && ' + push' || '' }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed only to push to ghcr (not used on pull_request builds)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate for real pushes — PR builds never publish.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main / dispatch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
