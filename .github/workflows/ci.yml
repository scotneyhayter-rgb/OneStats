name: CI

# Draft CI for the public repo. Builds and tests only — NO installer build, NO release/publish.
# Triggers on pushes and PRs to main. Keep the installer rebuild and release signing out of CI
# (those stay manual/approved; see docs/74-update-system.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    # A throwaway Postgres so the DB-backed tests (incl. RLS/workspace isolation) actually run.
    # Tests that need no DB skip gracefully when it is absent (settings.db_configured).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: onestats_app
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: onestats
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onestats_app"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (editable + dev tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff pytest
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        env:
          # Point tests at the CI Postgres. Leave unset to run only the DB-independent suite.
          ONESTATS_DB_HOST: localhost
          ONESTATS_DB_PORT: '5432'
          ONESTATS_DB_NAME: onestats
          ONESTATS_DB_USER: onestats_app
          ONESTATS_DB_PASSWORD: ci_only_not_a_secret
        run: pytest -q

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run lint
      - name: Tests (vitest)
        run: npm test
      - name: Build (vite)
        run: npm run build

  desktop-compile:
    name: Desktop compile check (Windows, no installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install frontend deps + build web assets
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Cargo check (Tauri crate — compile only, NO bundle/installer)
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
